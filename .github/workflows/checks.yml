name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    container: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=2
      - run: cargo build --locked --workspace --release
  python:
    runs-on: ubuntu-latest
    container: python:3.13-slim-bookworm@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26
    env:
      PYTHONPATH: apps/console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install -r tools/data/requirements.txt -r tools/latency/requirements.txt
      - run: python -B -m unittest discover -s apps/console/tests -p 'test_*.py'
      - run: python -B -m unittest discover -s tools/data -p 'test_*.py'
      - run: python -B -m unittest discover -s tools/latency -p 'test_*.py'
      - run: python -B -m unittest discover -s scripts -p 'test_*.py'
  strategy-parity:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --experimental-transform-types --test crates/mm2-strategy/tests/parity.test.ts
  frontend:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --experimental-transform-types --test tools/reference/*.test.ts
      - run: npm ci --no-audit --no-fund
        working-directory: apps/dashboard
      - run: npm test
        working-directory: apps/dashboard
      - run: npm run build
        working-directory: apps/dashboard
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sh scripts/bootstrap.sh
      - run: docker compose config --quiet
      - run: docker build --build-arg MM2_SOURCE_REVISION=${{ github.sha }} -t mm2-engine:local -f Dockerfile .
      - run: docker build --build-arg MM2_SOURCE_REVISION=${{ github.sha }} -t mm2-console:local -f Dockerfile.console .
      - run: python3 -B scripts/verify_stack.py

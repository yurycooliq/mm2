name: PR hygiene
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p test_pr_hygiene.py
      - run: python3 -B scripts/pr_hygiene.py audit --event "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

name: mm2
services:
  engine:
    image: mm2-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8088:8088"]
    environment:
      MM2_ENGINE_API_TOKEN: ${MM2_ENGINE_API_TOKEN:?Run scripts/bootstrap.ps1}
      MM2_POLY_PRIVATE_KEY: ${MM2_POLY_PRIVATE_KEY:-}
      MM2_POLY_API_KEY: ${MM2_POLY_API_KEY:-}
      MM2_POLY_API_SECRET: ${MM2_POLY_API_SECRET:-}
      MM2_POLY_API_PASSPHRASE: ${MM2_POLY_API_PASSPHRASE:-}
      MM2_POLYGON_RPC_URL: ${MM2_POLYGON_RPC_URL:-}
      MM2_POLY_RELAYER_API_KEY: ${MM2_POLY_RELAYER_API_KEY:-}
      MM2_POLY_RELAYER_API_KEY_ADDRESS: ${MM2_POLY_RELAYER_API_KEY_ADDRESS:-}
      MM2_POLY_BUILDER_API_KEY: ${MM2_POLY_BUILDER_API_KEY:-}
      MM2_POLY_BUILDER_API_SECRET: ${MM2_POLY_BUILDER_API_SECRET:-}
      MM2_POLY_BUILDER_API_PASSPHRASE: ${MM2_POLY_BUILDER_API_PASSPHRASE:-}
    volumes:
      - type: bind
        source: ${MM2_ENGINE_CONFIG:-./config/demo.toml}
        target: /app/config.toml
        read_only: true
        bind: {create_host_path: false}
      - engine-data:/data
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    pids_limit: 64
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  console:
    image: mm2-console:local
    build:
      context: .
      dockerfile: Dockerfile.console
    init: true
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      engine: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      MM2_ENGINE_URL: http://engine:8088
      MM2_ENGINE_API_TOKEN: ${MM2_ENGINE_API_TOKEN:?Run scripts/bootstrap.ps1}
      MM2_CONSOLE_TOKEN: ${MM2_CONSOLE_TOKEN:?Run scripts/bootstrap.ps1}
      MM2_TELEGRAM_BOT_TOKEN: ${MM2_TELEGRAM_BOT_TOKEN:-}
      MM2_TELEGRAM_OWNER_ID: ${MM2_TELEGRAM_OWNER_ID:-}
      MM2_MINIAPP_URL: ${MM2_MINIAPP_URL:-}
      MM2_ALLOWED_ORIGINS: ${MM2_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      MM2_CONSOLE_STATE_DIR: /data
      MM2_CONSOLE_STATIC_DIR: /app/dashboard
      MM2_CONSOLE_RESEARCH_VIEW_DIR: /research-view
    volumes: [console-data:/data, "research-view:/research-view:ro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    pids_limit: 48
    cpus: 0.25
    mem_limit: 128m
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  reference-refresh:
    image: mm2-console:local
    init: true
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["python", "-B", "scripts/refresh_comparison.py", "--out", "/data", "--loop", "--interval-seconds", "300"]
    healthcheck: {disable: true}
    volumes: [research-view:/data]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    pids_limit: 16
    cpus: 0.1
    mem_limit: 192m
    stop_grace_period: 20s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "2m", max-file: "2"}}
    networks: [public-read]
volumes:
  engine-data:
  console-data:
  research-view:
networks:
  public-read:

[package]
name = "mm2-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
mm2-core = { path = "../mm2-core" }
polymarket_client_sdk_v2 = { version = "=0.7.0", features = ["clob", "ws", "data"] }
alloy = { version = "1.6.3", default-features = false, features = ["sol-types", "dyn-abi", "consensus", "eips"] }
async-trait = "0.1"
chrono = "0.4"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

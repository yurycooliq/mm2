[package]
name = "mm2-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
mm2-core = { path = "../mm2-core" }
mm2-emulator = { path = "../mm2-emulator" }
mm2-live = { path = "../mm2-live" }
mm2-strategy = { path = "../mm2-strategy" }
mm2-portfolio = { path = "../mm2-portfolio" }
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

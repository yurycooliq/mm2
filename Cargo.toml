[workspace]
members = ["crates/mm2-core", "crates/mm2-emulator", "crates/mm2-engine", "crates/mm2-live", "crates/mm2-strategy", "crates/mm2-portfolio"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

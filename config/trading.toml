mode = "trading"
feed_source = "public"
listen = "0.0.0.0:8088"
allow_remote_http = true
state_dir = "/data/trading"
live_state_dir = "/data/account-live"
journal_max_bytes = 8388608
command_capacity = 32
feed_capacity = 256

[limits]
initial_collateral_usd = "100"
max_imbalance_shares = "10"
lot_shares = "5"
half_width = "0.01"
max_feed_age_ms = 1000

# Public wallet identity is configured; activation remains explicitly disabled.
# No key values belong in this file. No allowance transaction is sent implicitly.
[live]
clob_url = "https://clob.polymarket.com"
chain_id = 137
protocol = 2
owner_address = "0x04Ad8Cb08F04b58fbcEa273603d6cd151Ba8aDB4"
signer_address = "0xa2300f310b59df6d0dec94576776ce5435bd0b3f"
funder_address = "0x04Ad8Cb08F04b58fbcEa273603d6cd151Ba8aDB4"
exchange_address = "0xE111180000d2663C0091e4f400237545B87B996B"
collateral_address = "0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB"
signature_type = 3
private_key_env = "MM2_POLY_PRIVATE_KEY"
api_key_env = "MM2_POLY_API_KEY"
api_secret_env = "MM2_POLY_API_SECRET"
api_passphrase_env = "MM2_POLY_API_PASSPHRASE"
allowed_conditions = []
allowed_market_prefixes = ["btc-updown-5m-"]
